name: Build and release

# Every push to main is a release: tests run, the next patch version is
# tagged (v1.0.0 -> v1.0.1 -> ...), Windows and macOS are built and the
# release is published, where the in-app updater finds it.
#
# A hand-pushed tag still works: vX.Y.Z (for a minor or major step, e.g.
# v1.1.0, after which the automatic count carries on from it) or
# vX.Y.Z-beta.N for a prerelease. The tag this workflow pushes itself does
# not start a second run (pushes made with GITHUB_TOKEN never do).
#
# The builds go straight onto a draft release rather than through workflow
# artifacts: artifact storage has an account-wide quota, and once it was
# full every release failed at the upload step. The draft is invisible to
# the in-app updater (it reads releases/latest) until the last job
# publishes it.
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
    # Documentation alone is no new version.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

# Two quick pushes must not both take the same version number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze lib test --no-fatal-infos
          flutter test

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      channel: ${{ steps.ver.outputs.channel }}
      tag: ${{ steps.ver.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
              CHANNEL=beta
            elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              CHANNEL=stable
            else
              echo "Unsupported release tag: ${TAG}" >&2; exit 1
            fi
          else
            CHANNEL=stable
            STABLE='^v[0-9]+\.[0-9]+\.[0-9]+$'
            # A re-run of the same commit keeps the version it already got.
            TAG=$(git tag --points-at "$GITHUB_SHA" | grep -E "$STABLE" | sort -V | tail -n1 || true)
            if [ -z "$TAG" ]; then
              LAST=$(git tag --list 'v*' --sort=-v:refname | grep -E "$STABLE" | head -n1 || true)
              [ -z "$LAST" ] && LAST=v1.0.0
              IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
              TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
              git tag "$TAG" "$GITHUB_SHA"
              git push origin "$TAG"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG ($CHANNEL)"

      - name: Open a draft release for the builds to land on
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$TAG" == *-beta.* ]]; then
              gh release create "$TAG" --verify-tag --draft --prerelease --title "MesTerm $TAG" --notes "Building..."
            else
              gh release create "$TAG" --verify-tag --draft --title "MesTerm $TAG" --notes "Building..."
            fi
          fi

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMANDS_CHANNEL: ${{ needs.version.outputs.channel }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter Windows release
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release --dart-define=COMMANDS_CHANNEL=$env:COMMANDS_CHANNEL --dart-define=COMMANDS_VERSION=v$env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The fallback SSH client, for a Windows without the OpenSSH client.
      - name: Bundle plink.exe
        shell: pwsh
        run: |
          choco install putty.install --no-progress -y
          $plink = Get-ChildItem -Path "C:\Program Files\PuTTY","C:\Program Files (x86)\PuTTY" `
            -Filter plink.exe -ErrorAction SilentlyContinue -Recurse | Select-Object -First 1
          if (-not $plink) { throw "plink.exe not found after chocolatey install" }
          Copy-Item $plink.FullName "build\windows\x64\runner\Release\plink.exe"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          $options = @("/DMyAppVersion=$env:VERSION")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" @options windows\installer.iss

      - name: Zip portable build (no-installer alternative)
        shell: bash
        run: |
          OUT="MesTerm_${VERSION}_windows_portable"
          mkdir -p "dist2/$OUT"
          cp -r build/windows/x64/runner/Release/* "dist2/$OUT/"
          cd dist2 && 7z a "${OUT}.zip" "$OUT"

      - name: Attach to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist2/*.zip dist2/*Setup.exe --clobber

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMANDS_CHANNEL: ${{ needs.version.outputs.channel }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter macOS release
        run: |
          flutter pub get
          flutter build macos --release --dart-define=COMMANDS_CHANNEL=$COMMANDS_CHANNEL --dart-define=COMMANDS_VERSION=v$VERSION

      - name: Zip the .app (ditto keeps the bundle structure intact)
        shell: bash
        run: |
          mkdir -p dist2
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app")
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist2/MesTerm_${VERSION}_macOS.zip"

      - name: Attach to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist2/*.zip --clobber

  release:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      COMMANDS_CHANNEL: ${{ needs.version.outputs.channel }}
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Publish release
        shell: bash
        run: |
          mkdir -p assets
          gh release download "$TAG" -D assets -p '*.zip' -p '*Setup.exe' --clobber
          ls -la assets/

          # The in-app updater downloads the Windows installer and runs it, so
          # it checks the file against this list first (see
          # lib/services/update_service.dart). Bare file names, one per line in
          # sha256sum format, matching the asset names exactly.
          FILES=(assets/*_windows_portable.zip assets/*Setup.exe assets/*_macOS.zip)
          : > SHA256SUMS.txt
          for f in "${FILES[@]}"; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

          TAG_FILTER='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$COMMANDS_CHANNEL" = beta ]; then TAG_FILTER='^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; fi
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -E "$TAG_FILTER" | grep -v "^${TAG}\$" | head -n1 || true)
          if [ -n "$PREV_TAG" ]; then
            # A hand-written list for users (shown in the app's update
            # dialog) when there is one; otherwise the commit subjects.
            if [ -f "release-notes/${TAG}.md" ]; then
              CHANGELOG=$(cat "release-notes/${TAG}.md")
            else
              CHANGELOG=$(git log --pretty=format:'- %s' "${PREV_TAG}..${TAG}" | grep -v '^- Merge ' || true)
            fi
            [ -z "$CHANGELOG" ] && CHANGELOG="- (see commit history)"
            CHANGELOG_HEADER="## What's changed since ${PREV_TAG}"
          else
            CHANGELOG="- Initial release"
            CHANGELOG_HEADER="## What's changed"
          fi

          NAME="MesTerm"
          PREFIX="MesTerm"
          APP="MesTerm.app"
          EXE="mesterm.exe"
          MIGRATION_NOTE=''
          if [ "$COMMANDS_CHANNEL" = beta ]; then
            NAME="MesTerm Beta"
            MIGRATION_NOTE=''
          fi
          NOTES="${NAME} ${VERSION}

          ${CHANGELOG_HEADER}
          ${CHANGELOG}

          ## Windows
          - \`..._Setup.exe\` - installer (no admin rights needed, Start Menu + Desktop shortcuts, proper uninstall). Recommended.
          - \`..._portable.zip\` - unzip and run ${EXE} directly, no install.

          ## macOS
          1. Unzip \`${PREFIX}_${VERSION}_macOS.zip\` and drag the app to **Applications**.
          ${MIGRATION_NOTE}
          2. Not notarized (no paid Apple Developer account), so macOS quarantines it on first download. Run this once in Terminal:
             \`\`\`
             xattr -dr com.apple.quarantine "/Applications/${APP}"
             \`\`\`
          "

          gh release upload "$TAG" SHA256SUMS.txt --clobber
          if [ "$COMMANDS_CHANNEL" = beta ]; then
            gh release edit "$TAG" --title "MesTerm $TAG" --notes "$NOTES" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --title "MesTerm $TAG" --notes "$NOTES" --draft=false --prerelease=false --latest
          fi

      - name: Prune old releases (keep latest 5)
        shell: bash
        run: |
          PRERELEASE=false
          if [ "$COMMANDS_CHANNEL" = beta ]; then PRERELEASE=true; fi
          gh release list --limit 100 --json tagName,publishedAt,isDraft,isPrerelease \
            --jq "[.[] | select(.isDraft == false and .isPrerelease == $PRERELEASE)] | sort_by(.publishedAt) | reverse | .[5:] | .[].tagName" \
          | while read -r old; do
              echo "deleting old release $old"
              gh release delete "$old" --yes || true
            done
